name: FinCalc India CI / CD Quality Gate

on:
  push:
    branches: [main, master, "audit/**"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Type-Check, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Run Vitest Regulatory & Unit Test Suite
        run: npm test

      - name: Production Next.js Build
        run: npm run build
