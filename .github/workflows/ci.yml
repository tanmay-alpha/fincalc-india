name: FinCalc India Quality & Regulatory Assurance Gate

on:
  push:
    branches: [main, master, "audit/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    name: Lint, Type-Check, Migration Integrity & Coverage Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: fincalc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fincalc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXTAUTH_SECRET: "ci-testing-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/fincalc_test"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Clean Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify Prisma Migration Deployment
        run: npx prisma migrate deploy

      - name: Verify Migration Deployment Status
        run: npx prisma migrate status

      - name: Verify Prisma Schema and Migration Drift Check
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Run Vitest with Enforceable Coverage Thresholds
        run: npm run test:coverage

  build-and-e2e:
    name: Production Build & Playwright Browser Smoke/A11y
    needs: quality-and-unit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: fincalc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fincalc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXTAUTH_SECRET: "ci-testing-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/fincalc_test"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Clean Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Migrations for E2E
        run: npx prisma migrate deploy

      - name: Production Next.js Bundle Build
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Desktop Chromium E2E Suite
        run: npm run test:e2e:chromium

      - name: Run Mobile Chrome E2E Suite
        run: npm run test:e2e:mobile

      - name: Run Zero-Retry Accessibility Scan (Axe WCAG 2A/2AA)
        run: npm run test:a11y
