name: FinCalc India Quality & Regulatory Assurance Gate

on:
  push:
    branches: [main, master, "audit/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    name: Lint, Type-Check & Regulatory Test Suite
    runs-on: ubuntu-latest

    env:
      NEXTAUTH_SECRET: "ci-testing-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Clean Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Run Vitest Regulatory & Invariant Test Suite
        run: npm test

  build-and-e2e:
    name: Production Build & Playwright Browser Smoke/A11y
    needs: quality-and-unit
    runs-on: ubuntu-latest

    env:
      NEXTAUTH_SECRET: "ci-testing-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Clean Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Production Next.js Bundle Build
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Desktop Chromium E2E Suite
        run: npm run test:e2e:chromium

      - name: Run Mobile Chrome E2E Suite
        run: npm run test:e2e:mobile

