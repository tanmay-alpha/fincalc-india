name: Apply P0-P1 Product Audit Fixes

on:
  push:
    branches: ["fix/p0-p1-product-audit"]
    paths:
      - "scripts/apply_p0_p1_audit_fixes.py"
      - ".github/workflows/apply-p0-p1-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-p0-p1-product-audit
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: fincalc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fincalc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXTAUTH_SECRET: "ci-testing-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/fincalc_test"

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-product-audit
          fetch-depth: 0

      - name: Apply deterministic audit codemod
        run: python3 scripts/apply_p0_p1_audit_fixes.py

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy test migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit, statutory and regression tests
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop browser suite
        run: npm run test:e2e:chromium

      - name: Mobile browser suite
        run: npm run test:e2e:mobile

      - name: Accessibility suite
        run: npm run test:a11y

      - name: Commit verified generated patch
        run: |
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib tests e2e README.md
          git commit -m "fix: apply verified P0/P1 product audit corrections"
          git push origin HEAD:fix/p0-p1-product-audit
